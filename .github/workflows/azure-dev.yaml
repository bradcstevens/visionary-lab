on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unique environment name
        id: env-name
        run: |
          SUFFIX=$(echo "${{ github.sha }}" | head -c 6)
          ENV_NAME="vislab-${SUFFIX}"
          echo "AZURE_ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "Deploying as environment: ${ENV_NAME}"

      - name: Install azd
        uses: Azure/setup-azd@v2.1.0

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

      - name: Deploy Application
        run: azd deploy --no-prompt

      - name: Run Playwright E2E Tests
        id: e2e-tests
        continue-on-error: true
        run: |
          FRONTEND_URL=$(azd env get-value SERVICE_FRONTEND_URI 2>/dev/null || echo "")
          if [ -n "$FRONTEND_URL" ]; then
            cd frontend
            npm ci --legacy-peer-deps
            npx playwright install --with-deps chromium
            PLAYWRIGHT_BASE_URL="$FRONTEND_URL" npx playwright test tests/e2e/deployment-validation.spec.ts --reporter=html
          else
            echo "No frontend URL found, skipping E2E tests"
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.env-name.outputs.env_name }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down on failure
        if: failure() || steps.e2e-tests.outcome == 'failure'
        run: azd down --force --purge --no-prompt

      - name: Tear down on success
        if: success() && steps.e2e-tests.outcome == 'success'
        run: azd down --force --purge --no-prompt
